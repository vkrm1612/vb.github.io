# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.

# Basic Site Settings
locale                   : "en-US"
site_theme               : "default" # Options: "default", "air", "sunrise", "mint", "dirt", "contrast"
title                    : "Vikram Bharadwaj | Portfolio"
title_separator          : "-"
name                     : &name "Vikram Bharadwaj"
description              : &description "Mechanical Engineer specializing in Parametric Design, FEA, CFD, and Embedded Systems"
url                      : "https://vkrm1612.github.io"
baseurl                  : "" 
repository               : "vkrm1612/vb.github.io"

# Site Author
author:
  avatar           : "profile.png" # Ensure this file is in your /images/ folder
  name             : "Vikram Bharadwaj"
  bio              : "Mechanical Engineer | Parametric Design | FEA | CFD"
  location         : "United Kingdom"
  email            : "vikrambharadwajchepuri@gmail.com"
  phone            : "07881655683"

  # Repositories and software development
  github           : "vkrm1612"

  # Social media
  linkedin         : "vikram-bharadwaj-366855194"

# Site Settings
teaser                   :  # Fallback image in /images/ for social media previews
breadcrumbs              : false
words_per_minute         : 160
future                   : true
read_more                : "disabled"
talkmap_link             : false

# Reading Files
include:
  - .htaccess
  - _pages
  - files
exclude:
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .github
  - .jekyll-assets-cache
  - .sass-cache
  - Dockerfile
  - Gemfile
  - LICENSE
  - README
  - node_modules
  - package.json*

# Conversion
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false

# Collections settings
collections:
  portfolio:
    output: true
    permalink: /:collection/:path/

# Default layouts for collections
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: portfolio
    values:
      layout: single
      author_profile: true
      share: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/

# HTML Compression
compress_html:
  clippings: all
  ignore:
    envs: development